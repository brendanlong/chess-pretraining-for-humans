version: 2

# cooldown mirrors the exclude-newer = "7 days" rule the lockfiles are
# generated under: nothing gets proposed until it has been public a week.
# (Security updates ignore cooldown, which is what we want.)
#
# Note for the uv entry: Dependabot regenerates uv.lock without our global
# uv config, so its PRs drop the `[options] exclude-newer` block. That's
# harmless — CI uses `uv sync --frozen` — and the next local `uv lock`
# writes it back.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      eslint:
        patterns: ["*"]

  # The Litestream base image is pinned to an exact version in the Dockerfile,
  # so without this entry nothing would ever propose updating the one component
  # guarding the off-machine copy of `responses`.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The runtime Python image must stay in lockstep with the uv build
      # stage's interpreter (the venv's site-packages path bakes the minor
      # version in), and dependabot only bumps one of the two FROM lines —
      # the result is an image where every import fails at startup. Python
      # upgrades are manual; see the comment in the Dockerfile.
      - dependency-name: "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

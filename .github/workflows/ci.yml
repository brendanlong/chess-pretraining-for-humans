name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # --frozen, not --locked: uv.lock records an `exclude-newer` from the
    # authoring machine's global uv config, which a runner doesn't have, so
    # --locked always reports the lock as stale. --frozen uses it as-is.
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7, so pin exactly
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Node is here, not just in the `web` job, because the suite has to run
      # against the tree the image actually serves — which only exists once the
      # frontend is built. `npm ci` also vendors chessground into web/, without
      # which the source tree is incomplete.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build web-dist
        run: npm run build
      # The PNGs-are-squeezed test needs it, and fails rather than skips when
      # it's missing. `update` first: the runner image's apt index can be a
      # week stale, and a superseded pool file 404s without it.
      - name: install optipng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends optipng
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      # Twice, because the two trees are meant to differ only in size and this
      # is what holds them to it: once against web-dist/ (what ships, and what
      # the server picks by default when it's there), once against the sources
      # a dev checkout runs with no build.
      - name: pytest (built tree)
        run: uv run pytest -q
      - name: pytest (source tree)
        run: TRAINER_WEB_DIR=web uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: eslint
        run: npm run lint

  # The image can build cleanly and still be unable to start: the venv is
  # COPY'd between stages, so a build/runtime interpreter mismatch (or anything
  # else broken at import time) surfaces only when the container boots — which
  # otherwise happens during the deploy's health checks, after the old machine
  # is already being replaced. So: build the same Dockerfile flyctl will, boot
  # it the way Fly does (real entrypoint, no S3 config — it warns and runs the
  # server directly; the schema is created on the empty database), and require
  # the health check and a page to answer.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t smoke .
      # 127.0.0.1, not localhost: uvicorn binds only IPv4 inside the
      # container, and a proxy handed the ::1 side of localhost may forward it
      # as IPv6 to a port nobody listens on.
      - name: boot and probe
        run: |
          docker run -d --name smoke -p 8080:8080 smoke
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/healthz \
            && curl -fsS -o /dev/null http://127.0.0.1:8080/ \
            || { docker logs smoke; exit 1; }

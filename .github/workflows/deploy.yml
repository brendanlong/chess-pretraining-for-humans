name: Deploy

# Deploys follow a green CI run rather than the push itself: this app has one
# machine and one database, so a bad deploy is downtime, not a rolled-back
# replica set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One machine, one volume, one SQLite writer — overlapping deploys have
# nothing good to do with each other.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs against the default branch's tip; pin to the
          # commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: a second machine would fork the database. See fly.toml.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

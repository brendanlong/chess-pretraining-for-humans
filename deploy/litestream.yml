# Continuous replication of the SQLite file to S3. The item bank is
# rebuildable from the pipeline; `responses` is not, and it lives in the same
# file, so a Fly volume — one disk on one host — isn't where it should end.
#
# Litestream 0.5 takes a single `replica` per database; the 0.3 `replicas:`
# array is deprecated and more than one is now an error.
dbs:
  - path: ${TRAINER_DB}
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: items.db
      region: ${AWS_REGION}

# Litestream defaults both of these to 24h, which would mean a mistake noticed
# on Monday is already unrecoverable. Snapshots are cheap next to the value of
# the experimental record.
#
# The ceiling is web/privacy.html, which tells users how long a deleted account
# survives in backups: a row deleted in the app is still inside every snapshot
# taken before the delete. 504h = 21 days, leaving room for the bucket's
# noncurrent-version window on top — keep this equal to
# `snapshot_retention_days` in terraform/variables.tf, where the sum is
# checked.
snapshot:
  interval: 24h
  retention: 504h

# Continuous replication of the SQLite file to S3. The item bank is
# rebuildable from the pipeline; `responses` is not, and it lives in the same
# file, so a Fly volume — one disk on one host — isn't where it should end.
#
# Litestream 0.5 takes a single `replica` per database; the 0.3 `replicas:`
# array is deprecated and more than one is now an error.
dbs:
  - path: ${TRAINER_DB}
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: items.db
      region: ${AWS_REGION}

# Litestream defaults both of these to 24h, which would mean a mistake noticed
# on Monday is already unrecoverable. Snapshots are cheap next to the value of
# the experimental record.
#
# The ceiling is web/privacy.html, which tells users how long a deleted account
# survives in backups: a row deleted in the app is still inside every snapshot
# taken before the delete. 504h = 21 days, leaving room for the bucket's
# noncurrent-version window on top — keep this equal to
# `snapshot_retention_days` in terraform/variables.tf, where the sum is
# checked.
snapshot:
  interval: 24h
  retention: 504h

# Litestream's S3 client applies its seek client-side: every listing walks a
# whole level prefix, and the whole XML body leaves the region, which on Fly is
# billed egress. Cost is objects-per-prefix times listings-per-day, and both
# defaults below are set for a busier database than this one.
#
# The L0 sweep is the expensive listing. Each pass first enumerates all of L1
# to learn how far compaction got, so at the stock 15s it reads a 21-day L1
# prefix four times a minute whether or not anything was written — ~12 GB/day
# of billed egress against ~$2/month of storage. Sweeping no more often than
# the window it enforces costs only that a deletable L0 file waits a few extra
# minutes. 5m is also the stock retention; it is pinned so the two stay a pair
# if that default moves.
l0-retention: 5m
l0-retention-check-interval: 5m

# Compaction is the other enumerator: each level reads all of the level below
# on every run, and a successful L1 compaction sweeps L0 as well — so the L1
# interval sets a second listing rate on top of the one above. Stretching the
# levels (stock 30s / 5m / 1h) cuts how often that happens and caps how many
# objects 21 days of L1 can hold, which is what keeps this flat as traffic
# grows. Durability is untouched: it comes from the raw L0 files the replica
# writes at the 1s sync interval, not from compaction. The trade is a longer L0
# tail to replay at restore. A `levels` block replaces the stock levels
# outright rather than merging, so all three are listed; L0 is implicit.
levels:
  - interval: 5m # L1
  - interval: 1h # L2
  - interval: 6h # L3

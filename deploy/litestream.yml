# Continuous replication of the SQLite file to S3. The item bank is
# rebuildable from the pipeline; `responses` is not, and it lives in the same
# file, so a Fly volume — one disk on one host — isn't where it should end.
#
# Litestream 0.5 takes a single `replica` per database; the 0.3 `replicas:`
# array is deprecated and more than one is now an error.
dbs:
  - path: ${TRAINER_DB}
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: items.db
      region: ${AWS_REGION}

# Litestream defaults both of these to 24h, which would mean a mistake noticed
# on Monday is already unrecoverable. Snapshots are cheap next to the value of
# the experimental record.
#
# The ceiling is web/privacy.html, which tells users how long a deleted account
# survives in backups: a row deleted in the app is still inside every snapshot
# taken before the delete. 504h = 21 days, leaving room for the bucket's
# noncurrent-version window on top — keep this equal to
# `snapshot_retention_days` in terraform/variables.tf, where the sum is
# checked.
snapshot:
  interval: 24h
  retention: 504h

# Litestream's S3 client applies its seek client-side: every listing walks a
# whole level prefix and the whole XML response leaves the region, which on Fly
# is billed egress. Two timers do nearly all of that walking, and both default
# far finer than replication here needs.
#
# The expensive one is the L0 sweep. Each pass first enumerates all of L1 to
# learn how far compaction got, so at its 15s default it reads a 21-day L1
# prefix four times a minute forever, whether or not anything was written —
# ~12 GB/day and $44/month before this was pinned. Sweeping no more often than
# the window it enforces costs only that a deletable L0 file waits a few extra
# minutes.
l0-retention: 5m
l0-retention-check-interval: 5m

# The other enumerator is compaction itself: a level reads all of the level
# below on every run. Stretching the intervals (defaults 30s / 5m / 1h) cuts
# both how often that happens and how many objects 21 days of L1 can hold.
# Durability is unaffected — that comes from the raw L0 files the replica
# writes at its 1s sync interval, not from compaction — so what this trades is
# a longer L0 tail to replay at restore. A `levels` block replaces the defaults
# outright rather than merging, so all three are listed; L0 is implicit.
levels:
  - interval: 5m # L1
  - interval: 1h # L2
  - interval: 6h # L3

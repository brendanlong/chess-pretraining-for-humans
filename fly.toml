# See deploy/README.md for the one-time bootstrap.
app = "chess-pretraining"
# Ashburn. web/privacy.html tells users the app is hosted in the United States
# and reserves the region itself as an operational choice, so this can move —
# within the country, or the page changes with it.
primary_region = "iad"

# SIGINT is what Litestream forwards to the server; the 30s matches its
# shutdown sync, and Fly's 5s default would cut that short on every deploy and
# every other stop — `fly machine restart`, a host migration — losing the tail
# of whatever was just answered.
kill_signal = "SIGINT"
kill_timeout = 30

[build]
# flyctl picks up ./Dockerfile on its own.

[env]
TRAINER_DB = "/data/items.db"
# fly-proxy sets this one itself. X-Forwarded-For would be the obvious choice
# and is the wrong one: the proxy appends to whatever the caller sent, so the
# entry uvicorn reads is the caller's to invent, and the signup limiter would
# be counting a value the flooder picks.
CLIENT_IP_HEADER = "fly-client-ip"

# SQLite has one writer, so this app has exactly one machine. Deploy with
# --ha=false: a second machine would need its own volume (a fork of the
# database, silently serving different users different history) and would be a
# second Litestream writing the same S3 prefix, which corrupts the replica.
[[mounts]]
source = "chess_pretraining_data"
destination = "/data"
initial_size = "1gb"

[http_service]
internal_port = 8080
force_https = true
# Keep one machine up. A user thinking over a position sends no requests, so
# scaling to zero puts the cold start on the move they just committed — the
# moment the app should feel quickest. The floor costs a shared-cpu-1x running
# full time; that buys away the idle stop, not restarts in general (a deploy
# still restarts, and this deploys on every green build of main).
#
# The two lines under it look dead now — the proxy can't stop the only machine
# below the floor — and neither is. `min_machines_running` has no effect at all
# unless `auto_stop_machines` is "stop" or "suspend", so deleting that line
# quietly restores scale-to-zero. And nothing starts a machine to satisfy the
# floor: `auto_start_machines` is what brings one back on the next request if
# it ends up stopped some other way. "stop" not "suspend", because suspend
# skips the clean shutdown Litestream needs to flush its last writes.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
path = "/healthz"
method = "GET"
interval = "15s"
timeout = "5s"
# Covers a first-boot `litestream restore`, which runs before uvicorn binds.
grace_period = "30s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

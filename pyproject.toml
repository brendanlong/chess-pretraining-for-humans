[project]
name = "chess-pretraining"
version = "0.1.0"
description = "Pairwise chess move-discrimination trainer with Stockfish-calibrated difficulty"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

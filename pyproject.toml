[project]
name = "chess-pretraining"
version = "0.1.0"
description = "Pairwise chess move-discrimination trainer with Stockfish-calibrated difficulty"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chess>=1.11.2",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
assets = [
    "playwright>=1.61.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
    "pyright>=1.1.407",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.pyright]
include = ["trainer", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# python-chess's InfoDict marks every key NotRequired, so any info["score"] /
# info["pv"] read trips this even where the search guarantees the key.
reportTypedDictNotRequiredAccess = "none"

<!DOCTYPE html>
<!--
  Hand-written 1200x630 mock of the trial screen, screenshotted by
  scripts/generate_assets.py. It is a wireframe rather than the real page so
  that generating the image needs no database and no server: the point is the
  forced choice, and that reads fine from a fixed position.

  Board art is the vendored cburnett piece set (Colin M.L. Burnett, CC BY-SA),
  reached by giving the board `class="cg-wrap"` — that is the ancestor selector
  chessground.cburnett.css keys off. None of chessground's own layout applies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Pretraining — social preview</title>
<link rel="stylesheet" href="../web/vendor/chessground.cburnett.css">
<style>
  /* Every --var below this line comes from web/style.css, injected by
     generate_assets.py — the card advertises the app, so it can't be holding
     its own copy of colours the app has since changed. Opening this file
     directly renders it unstyled; run the generator. */
  /* The board, which the app doesn't state as colors — chessground lays 20%
     black over the light square, so this is what it composites to on screen. */
  :root {
    --light: #f0d9b5;
    --dark: #c0ad90;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 56px 64px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }

  /* --- board ------------------------------------------------------------ */

  #board {
    position: relative;
    flex: none;
    width: 518px;
    height: 518px;
    display: grid;
    grid-template: repeat(8, 1fr) / repeat(8, 1fr);
    border-radius: 6px;
    overflow: hidden;
  }
  .sq { background: var(--light); }
  .sq.d { background: var(--dark); }
  piece {
    display: block;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  /* Candidate arrows: the board variants of the two button colors, at the
     opacity the app draws them with. SVG presentation attributes can't hold a
     var(), so the colors are applied here rather than on the elements. */
  #arrows {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
  }
  .a1 { stroke: var(--arrow-1); }
  .a2 { stroke: var(--arrow-2); }
  .a1-head { fill: var(--arrow-1); }
  .a2-head { fill: var(--arrow-2); }

  /* The numbered disc each arrow carries, in a layer of its own because the
     app draws these at full opacity over the translucent arrows. */
  #arrow-labels { position: absolute; inset: 0; width: 100%; height: 100%; }
  #arrow-labels circle { stroke: #fff; stroke-width: 0.05; }
  #arrow-labels text {
    font-size: 0.3px;
    font-weight: 700;
    text-anchor: middle;
    fill: #fff;
  }
  .l1 { fill: var(--arrow-1); }
  .l2 { fill: var(--arrow-2); }

  /* --- panel ------------------------------------------------------------ */

  #panel { flex: 1; min-width: 0; }

  #brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #brand img { width: 44px; height: 44px; }

  #prompt {
    margin: 30px 0 14px;
    font-size: 27px;
    font-weight: 600;
    color: var(--text);
  }

  #choices { display: flex; gap: 14px; }
  .choice {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 31px;
    font-weight: 700;
  }
  .choice:first-child { border-color: var(--accent-1); }
  .choice:last-child { border-color: var(--accent-2); }
  /* The same numbered disc as on the arrow, in the panel's lighter variant. */
  .choice .key {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 20px;
    font-weight: 700;
    color: var(--bg);
  }
  .choice:first-child .key { background: var(--accent-1); }
  .choice:last-child .key { background: var(--accent-2); }

  #tagline {
    margin: 34px 0 0;
    font-size: 22px;
    line-height: 1.45;
    color: var(--muted);
  }
  #tagline b { color: var(--text); font-weight: 600; }

  #url {
    margin: 30px 0 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent-1);
  }

  #credit {
    margin: 26px 0 0;
    font-size: 13px;
    color: #5f5b55;
  }
</style>
</head>
<body>

<div id="board" class="cg-wrap">
  <!-- Item 31395 of the bank, from https://lichess.org/Ak8CyOQm — Black to
     move. Bxe5 looks like it wins the knight while hitting the queen, but
     loses to the Rxd8 zwischenzug; the quiet Qb8 steps off the d-file so the
     capture works next move. Drawn from Black's side, h1 in the top-left,
     because the app orients the board to the mover. -->
  <div class="sq"></div>
  <div class="sq d"><piece class="white king"></piece></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white rook"></piece></div>
  <div class="sq"><piece class="white rook"></piece></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>

  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"><piece class="white pawn"></piece></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"><piece class="white pawn"></piece></div>

  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white knight"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>

  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white queen"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>

  <div class="sq"></div>
  <div class="sq d"><piece class="white bishop"></piece></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white knight"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>

  <div class="sq d"></div>
  <div class="sq"><piece class="black bishop"></piece></div>
  <div class="sq d"><piece class="black knight"></piece></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="black bishop"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>

  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"><piece class="black pawn"></piece></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"><piece class="black pawn"></piece></div>

  <div class="sq d"></div>
  <div class="sq"><piece class="black king"></piece></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black rook"></piece></div>
  <div class="sq d"><piece class="black queen"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black rook"></piece></div>

  <!-- Board coordinates: one unit per square, h1 at the origin — the board
       is from Black's side, as the app draws a Black-to-move item — so the
       center of the square on file f (a=0) and rank r is (7.5 - f, r - 0.5).
       Both lines stop a head-length short of the destination center and start
       a little outside the origin center, the way chessground draws them. -->
  <svg id="arrows" viewBox="0 0 8 8">
    <defs>
      <marker id="head-1" orient="auto" markerWidth="3.2" markerHeight="3.2"
              refX="0" refY="1.6">
        <path class="a1-head" d="M0,0 V3.2 L3.2,1.6 Z"></path>
      </marker>
      <marker id="head-2" orient="auto" markerWidth="3.2" markerHeight="3.2"
              refX="0" refY="1.6">
        <path class="a2-head" d="M0,0 V3.2 L3.2,1.6 Z"></path>
      </marker>
    </defs>
    <!-- Bd6xe5 -->
    <line class="a1" x1="4.302" y1="5.302" x2="4.023" y2="5.023"
          stroke-width="0.2" marker-end="url(#head-1)"></line>
    <!-- Qd8-b8 -->
    <line class="a2" x1="4.780" y1="7.500" x2="5.760" y2="7.500"
          stroke-width="0.2" marker-end="url(#head-2)"></line>
  </svg>

  <!-- The discs, backed 33/64 of a square off the destination centre along
       the arrow, which is where chessground puts a shape label when nothing
       else is aimed at that square: d6-e5 gives (3.5, 4.5) - 0.516*(-.707, -.707),
       and d8-b8 gives (6.5, 7.5) - 0.516*(1, 0). The digit sits a little below
       the centre so its body, not its box, is what looks centred. -->
  <svg id="arrow-labels" viewBox="0 0 8 8">
    <circle class="l1" cx="3.865" cy="4.865" r="0.22"></circle>
    <text x="3.865" y="4.963">1</text>
    <circle class="l2" cx="5.984" cy="7.500" r="0.22"></circle>
    <text x="5.984" y="7.598">2</text>
  </svg>
</div>

<div id="panel">
  <div id="brand"><img src="../web/favicon.svg" alt="">Chess Pretraining</div>
  <p id="prompt">Which move is better?</p>
  <div id="choices">
    <div class="choice"><span class="key">1</span>Bxe5</div>
    <div class="choice"><span class="key">2</span>Qb8</div>
  </div>
  <p id="tagline">Real positions, two candidate moves, instant feedback.
  Difficulty adapts to hold you near <b>80% accuracy</b>.</p>
  <p id="url">chess-pretraining.brendanlong.com</p>
  <!--
    The card gets shared detached from the site, so the CC BY-SA credit for
    the pieces has to travel on the image itself — the terms page can't
    attribute art that is sitting in someone else's timeline.
  -->
  <p id="credit">Pieces: cburnett by Colin M.L. Burnett, CC BY-SA</p>
</div>

</body>
</html>

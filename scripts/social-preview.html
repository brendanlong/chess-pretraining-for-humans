<!DOCTYPE html>
<!--
  Hand-written 1200x630 mock of the trial screen, screenshotted by
  scripts/generate_assets.py. It is a wireframe rather than the real page so
  that generating the image needs no database and no server: the point is the
  forced choice, and that reads fine from a fixed position.

  Board art is the vendored cburnett piece set (Colin M.L. Burnett, CC BY-SA),
  reached by giving the board `class="cg-wrap"` — that is the ancestor selector
  chessground.cburnett.css keys off. None of chessground's own layout applies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Pretraining — social preview</title>
<link rel="stylesheet" href="../web/vendor/chessground.cburnett.css">
<style>
  :root {
    --bg: #161512;
    --panel: #211f1c;
    --card: #2c2a26;
    --line: #3a3733;
    --text: #d8d5d0;
    --muted: #8f8a83;
    --accent-1: #4a90d9;
    --accent-2: #a678de;
    --light: #f0d9b5;
    --dark: #b58863;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 56px 64px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }

  /* --- board ------------------------------------------------------------ */

  #board {
    position: relative;
    flex: none;
    width: 518px;
    height: 518px;
    display: grid;
    grid-template: repeat(8, 1fr) / repeat(8, 1fr);
    border-radius: 6px;
    overflow: hidden;
  }
  .sq { background: var(--light); }
  .sq.d { background: var(--dark); }
  piece {
    display: block;
    width: 100%;
    height: 100%;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  /* Candidate arrows, in the same two colors as the buttons. */
  #arrows {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.85;
  }

  /* --- panel ------------------------------------------------------------ */

  #panel { flex: 1; min-width: 0; }

  #brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #brand img { width: 44px; height: 44px; }

  #prompt {
    margin: 30px 0 14px;
    font-size: 27px;
    font-weight: 600;
    color: var(--text);
  }

  #choices { display: flex; gap: 14px; }
  .choice {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 31px;
    font-weight: 700;
  }
  .choice:first-child { border-color: var(--accent-1); }
  .choice:last-child { border-color: var(--accent-2); }
  .choice .key {
    flex: none;
    padding: 2px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    font-size: 20px;
    font-weight: 600;
    color: var(--muted);
  }

  #tagline {
    margin: 34px 0 0;
    font-size: 22px;
    line-height: 1.45;
    color: var(--muted);
  }
  #tagline b { color: var(--text); font-weight: 600; }

  #url {
    margin: 30px 0 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent-1);
  }

  #credit {
    margin: 26px 0 0;
    font-size: 13px;
    color: #5f5b55;
  }
</style>
</head>
<body>

<div id="board" class="cg-wrap">
  <!-- Greek gift: white to move, Bxh7+ against the quiet Ne5. -->
  <div class="sq"><piece class="black rook"></piece></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black bishop"></piece></div>
  <div class="sq d"><piece class="black queen"></piece></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="black rook"></piece></div>
  <div class="sq"><piece class="black king"></piece></div>
  <div class="sq d"></div>

  <div class="sq d"><piece class="black pawn"></piece></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"><piece class="black pawn"></piece></div>
  <div class="sq"><piece class="black knight"></piece></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"><piece class="black pawn"></piece></div>
  <div class="sq"><piece class="black pawn"></piece></div>

  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="black bishop"></piece></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"><piece class="black knight"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>

  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="black pawn"></piece></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>

  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"></div>

  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white knight"></piece></div>
  <div class="sq"><piece class="white bishop"></piece></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"><piece class="white knight"></piece></div>
  <div class="sq d"></div>
  <div class="sq"></div>

  <div class="sq"><piece class="white pawn"></piece></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"><piece class="white pawn"></piece></div>
  <div class="sq d"></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white pawn"></piece></div>
  <div class="sq"><piece class="white pawn"></piece></div>
  <div class="sq d"><piece class="white pawn"></piece></div>

  <div class="sq d"><piece class="white rook"></piece></div>
  <div class="sq"></div>
  <div class="sq d"><piece class="white bishop"></piece></div>
  <div class="sq"><piece class="white queen"></piece></div>
  <div class="sq d"></div>
  <div class="sq"><piece class="white rook"></piece></div>
  <div class="sq d"><piece class="white king"></piece></div>
  <div class="sq"></div>

  <!--
    Board coordinates: one unit per square, a8 at the origin, so the center of
    the square on file f (a=0) and rank r is (f + 0.5, 8.5 - r). Both lines
    stop a head-length short of the destination center and start a little
    outside the origin center, the way chessground draws them.
  -->
  <svg id="arrows" viewBox="0 0 8 8">
    <defs>
      <marker id="head-1" orient="auto" markerWidth="3.2" markerHeight="3.2"
              refX="0" refY="1.6">
        <path d="M0,0 V3.2 L3.2,1.6 Z" fill="#4a90d9"></path>
      </marker>
      <marker id="head-2" orient="auto" markerWidth="3.2" markerHeight="3.2"
              refX="0" refY="1.6">
        <path d="M0,0 V3.2 L3.2,1.6 Z" fill="#a678de"></path>
      </marker>
    </defs>
    <!-- Bd3xh7 -->
    <line x1="3.698" y1="5.302" x2="6.977" y2="2.023" stroke="#4a90d9"
          stroke-width="0.2" marker-end="url(#head-1)"></line>
    <!-- Nf3-e5 -->
    <line x1="5.375" y1="5.250" x2="4.831" y2="4.162" stroke="#a678de"
          stroke-width="0.2" marker-end="url(#head-2)"></line>
  </svg>
</div>

<div id="panel">
  <div id="brand"><img src="../web/favicon.svg" alt="">Chess Pretraining</div>
  <p id="prompt">Which move is better?</p>
  <div id="choices">
    <div class="choice"><span class="key">1</span>Bxh7+</div>
    <div class="choice"><span class="key">2</span>Ne5</div>
  </div>
  <p id="tagline">Real positions, two candidate moves, instant feedback.
  Difficulty adapts to hold you near <b>80% accuracy</b>.</p>
  <p id="url">chess-pretraining.brendanlong.com</p>
  <!--
    The card gets shared detached from the site, so the CC BY-SA credit for
    the pieces has to travel on the image itself — the terms page can't
    attribute art that is sitting in someone else's timeline.
  -->
  <p id="credit">Pieces: cburnett by Colin M.L. Burnett, CC BY-SA</p>
</div>

</body>
</html>
